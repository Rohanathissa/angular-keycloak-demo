<div class="app-layout">
  <!-- Minimal Header for Authentication -->
  <header class="app-header">
    <div class="brand">
      <span class="logo">🔐</span>
      <h1>Secure App</h1>
    </div>
    <div class="user-menu">
      @if (username) {
        <span class="user-info">Logged in as <strong>{{ fullName || username }}</strong></span>
        <button class="btn-logout" (click)="logout()">Log Out</button>
      } @else {
        <span class="user-info">Not Authenticated</span>
      }
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="app-content">
    <router-outlet></router-outlet>
  </main>
</div>
